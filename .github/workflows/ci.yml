name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          version: "2026.10.6"
          install_args: "go golangci-lint"
      - name: Lint and formatting
        run: mise run lint
      - name: D-Bus protocol test prerequisite
        run: command -v dbus-daemon
      - name: Tests
        run: mise run test
      - name: Race tests
        run: mise run test-race
      - name: Build
        run: mise run build

  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          version: "2026.10.6"
          install_args: "go golangci-lint"
      - name: Format and lint
        run: |
          mise run fmt
          git diff --exit-code
          mise run lint
      - name: Offline tests
        run: mise run test
      - name: Race tests
        run: mise run test-race
      - name: Validate property lists
        run: |
          python3 contrib/macos/render-agent.py daemon --instance ci --app '/tmp/Grove & CI.app' --config '/tmp/config & CI.json' --output /tmp/groved-ci.plist
          python3 contrib/macos/render-agent.py tray --instance ci --app '/tmp/Grove & CI.app' --profile '/tmp/profile & CI' --name 'CI & Grove' --output /tmp/tray-ci.plist
          plutil -lint contrib/macos/Grove-Info.plist /tmp/groved-ci.plist /tmp/tray-ci.plist
      - name: Build app
        run: mise run build
      - name: Cross-build Linux CLI and daemon
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/grove-linux ./cmd/grove
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/groved-linux ./cmd/groved
