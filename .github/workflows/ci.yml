name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          version: "2026.10.6"
          install_args: "go golangci-lint"
      - name: Lint and formatting
        run: mise run lint
      - name: D-Bus protocol test prerequisite
        run: command -v dbus-daemon
      - name: Tests
        run: mise run test
      - name: Race tests
        run: mise run test-race
      - name: Build
        run: mise run build
